name: static-contract-guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-grace-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate strict static Grace contracts and absence of server code
        run: python3 scripts/verify_static_contract.py
